<html>
<head>
    <title>employee manegment</title>
    <style>
        body{
            margin:0
            font-family:Arial;
            background-color:white;
        }
        .header{
            background-color:#1e3a8a;
            color:whitesmoke;
            padding:20px;
            text-align:center;
        }
        .container{
            display:flex;
        }
        .sidebar{
            width:200px;
            height:100vh;
            background-color:blue;
            padding-top:20px;
        }
        .sidebar a{
            display:block;
            color:teal;
            padding:15px;
            text-decoration:none;
        }
        .sidebar a:hover{
            background-color:yellow;
        }
        .content{
            padding:30px;
            flex:1;
        }
        .cards{
            display:flex;
            gap:20px;
        }
        .card{
            background-color:whitesmoke;
            paddig:25px;
            width:180px;
            border-radius:10px;
            box-shadow:0 2px 8px orangered;
        }
        .card h2{color:blue;
        }
    </style>
    </head>
    <body>
        <div class="header">
            <h1>company employee manegment</h1>
        </div>
        <div class="cpntainer">
            <div class="sidebar">
                <a href="#">Dashboard</a>
                <a href="#">Employee</a>
                <a href="#">Attendence</a>
                <a href="#">Salary</a>
                <a href="#">Reports</a>
            </div>
        <div class="content">
            <h1>dashboard</h1>
            <p2>welcome to employee menegment system</p2>
                <div class="cards">
                    <div class="card">
                    <h2>120</h2>
                    <p>total employee</p>
                </div>
                <div class="card">
                    <h2>105</h2>
                    <p>present total</p>
                    </div>
                    <div class="card">
                        <h2>15</h2>
                        <p>absent today</p>
                </div>
            </div>
        </div>
    </body>
    </html>
